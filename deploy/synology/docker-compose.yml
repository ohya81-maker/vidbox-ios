# 시놀로지 Container Manager → 프로젝트 → 생성 → 경로: /docker/youtube
# KTUBE 설치 사이트(정적 파일)를 nginx로 제공한다. 외부 HTTPS는 DSM 리버스 프록시가 담당.
services:
  ktube-site:
    image: nginx:1.27-alpine
    container_name: ktube-site
    restart: unless-stopped
    ports:
      - "8090:80"          # DSM 리버스 프록시: https://mistylake.synology.me:8443 → http://localhost:8090
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
