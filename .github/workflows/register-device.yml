name: Register device

# 설치 페이지(시놀로지)의 「이 아이폰 등록」이 호출한다.
# 기기를 Apple 개발자 계정에 등록하고, 모든 기기가 들어간 프로필로 최신 IPA를 다시 서명해 같은 릴리스에 올린다.
# (다시 빌드하지 않으므로 몇 분이면 끝난다)
on:
  workflow_dispatch:
    inputs:
      udid:
        description: "iPhone UDID"
        required: true
      name:
        description: "기기 이름"
        required: false
        default: "K-TUBE iPhone"

permissions:
  contents: write

concurrency:
  group: register-device
  cancel-in-progress: false

jobs:
  resign:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        env:
          UDID: ${{ inputs.udid }}
        run: |
          echo "$UDID" | grep -Eq '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{16}|[0-9a-fA-F]{40})$' || { echo "잘못된 UDID"; exit 1; }

      - name: Register device and re-sign latest IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          UDID: ${{ inputs.udid }}
          DEVICE_NAME: ${{ inputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          SERIAL=$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin env:IOS_P12_PASSWORD 2>/dev/null \
                   | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2 || true)
          python3 tools/asc_profile.py --udid "$UDID" --name "$DEVICE_NAME" --cert-serial "$SERIAL" \
            --out "$RUNNER_TEMP/profile.mobileprovision"

          tag=$(gh release list -L 1 --json tagName -q '.[0].tagName')
          echo "최신 릴리스: $tag"
          gh release download "$tag" -p KTUBE-signed.ipa -O original.ipa --clobber
          rm -rf work && mkdir work && (cd work && unzip -q ../original.ipa)
          APP=$(ls -d work/Payload/*.app | head -1)

          KEYCHAIN="$RUNNER_TEMP/ktube.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print0 | \
            xargs -0 -I{} codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "{}"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          codesign --verify --deep --strict "$APP"

          (cd work && rm -f ../KTUBE-signed.ipa && zip -qry ../KTUBE-signed.ipa Payload)
          gh release upload "$tag" KTUBE-signed.ipa --clobber
          echo "다시 서명한 IPA를 $tag 에 올렸습니다"
