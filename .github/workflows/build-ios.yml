name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Playback smoke test (AVFoundation on macOS)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          swiftc -O ci/main.swift Vidbox/StreamResolver.swift Vidbox/Models.swift -o playtest
          ./playtest

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Vidbox.xcodeproj \
            -scheme Vidbox \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*Vidbox/|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/Vidbox.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Vidbox.app Payload/
          zip -qry Vidbox.ipa Payload
          ls -lh Vidbox.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vidbox-ipa
          path: Vidbox.ipa

      # ── 유료 개발자 계정 Ad Hoc 서명 (시크릿이 등록돼 있을 때만) ──────────────
      # 필요한 저장소 시크릿: IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64
      # 선택: SITE_BASE_URL (기본 https://mistylake.synology.me/youtube)
      #       SYNOLOGY_WEBDAV_URL / SYNOLOGY_WEBDAV_USER / SYNOLOGY_WEBDAV_PASSWORD → 시놀로지 자동 업로드
      - name: Sign IPA (Ad Hoc) and build install site
        id: sign
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        if: env.IOS_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ktube.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1{print $2}')
          echo "signing identity: $(security find-identity -v -p codesigning "$KEYCHAIN" | head -1)"

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          echo "profile: $(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist") / $PROFILE_APP_ID / devices: $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" | grep -c '^ ' || true) / expires: $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"

          # 서명 없이 빌드한 앱에 프로필을 넣고 배포 인증서로 서명
          rm -rf SignedPayload && mkdir -p SignedPayload
          cp -R build/Build/Products/Release-iphoneos/Vidbox.app SignedPayload/
          APP="SignedPayload/Vidbox.app"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$APP/embedded.mobileprovision"
          find "$APP" -depth \( -name "*.framework" -o -name "*.dylib" -o -name "*.appex" \) -print0 | \
            xargs -0 -I{} codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none "{}"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN" --timestamp=none \
            --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority" | head -5

          mkdir -p signed && cd signed && rm -rf Payload && mv ../SignedPayload Payload && zip -qry ../KTUBE-signed.ipa Payload && cd ..
          ls -lh KTUBE-signed.ipa

          # 시놀로지에 올릴 설치 사이트 (index.html, manifest.plist, apps.json, icon.png, IPA)
          BASE="${SITE_BASE_URL:-https://mistylake.synology.me/youtube}"
          python3 tools/make_site.py KTUBE-signed.ipa --base "$BASE" --out site-out/youtube \
            --notes "$(git log -1 --pretty=%s)"
          (cd site-out/youtube && zip -qry ../../ktube-site.zip .)
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload install site artifact
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ktube-site
          path: site-out/youtube/

      - name: Upload to Synology (WebDAV)
        if: steps.sign.outputs.signed == 'true'
        env:
          DAV_URL: ${{ secrets.SYNOLOGY_WEBDAV_URL }}
          DAV_USER: ${{ secrets.SYNOLOGY_WEBDAV_USER }}
          DAV_PASS: ${{ secrets.SYNOLOGY_WEBDAV_PASSWORD }}
        run: |
          if [ -z "$DAV_URL" ]; then echo "SYNOLOGY_WEBDAV_URL 시크릿이 없어 자동 업로드를 건너뜁니다."; exit 0; fi
          cd site-out/youtube
          for f in *; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -u "$DAV_USER:$DAV_PASS" -T "$f" "${DAV_URL%/}/$f")
            echo "upload $f -> $code"
          done

      - name: Simulator screenshots
        continue-on-error: true
        timeout-minutes: 15
        run: |
          xcodebuild -project Vidbox.xcodeproj -scheme Vidbox -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath simbuild -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build > sim-build.log 2>&1 || { tail -50 sim-build.log; exit 1; }
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "device $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" simbuild/Build/Products/Debug-iphonesimulator/Vidbox.app
          mkdir -p shots
          shot() { name=$1; shift; xcrun simctl launch --terminate-running-process "$DEVICE" com.mistylake.ktube "$@"; sleep ${WAIT:-12}; xcrun simctl io "$DEVICE" screenshot "shots/$name.png"; }
          shot home -ktubeTab home
          WAIT=14 shot search-results -ktubeSearch 아이유
          shot search-history -ktubeTab search
          WAIT=20 shot music -ktubeTab music
          shot kids -ktubeTab kids
          shot shorts -ktubeTab shorts
          WAIT=20 shot play-seek -ktubePlay dQw4w9WgXcQ -ktubeSeek 100 -ktubeDiag YES
          WAIT=14 shot floating -ktubePlay dQw4w9WgXcQ -ktubeCollapse YES
          WAIT=16 shot vertical -ktubePlay JRJtg4-sDYQ -ktubeDiag YES
          WAIT=14 shot fullscreen -ktubePlay dQw4w9WgXcQ -ktubeFullscreen YES
          WAIT=15 shot play-music -ktubeTab music -ktubePlay dQw4w9WgXcQ -ktubeAudio YES
          WAIT=45 shot downloads -ktubeDownload dQw4w9WgXcQ
          WAIT=22 shot play-music-seek -ktubeTab music -ktubePlay dQw4w9WgXcQ -ktubeAudio YES -ktubeSeek 150
          xcrun simctl spawn "$DEVICE" log show --last 3m --predicate 'process == "Vidbox"' --style compact 2>/dev/null | grep -iE "error|fault|crash" | tail -30 || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Vidbox build ${{ github.run_number }}
          files: |
            Vidbox.ipa
            KTUBE-signed.ipa
            ktube-site.zip
          make_latest: true
