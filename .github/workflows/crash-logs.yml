name: crash-logs

# TestFlight 충돌 보고(테스터가 「공유」한 것)를 받아 artifact로 남긴다 (이메일 등 개인 정보는 빼고 기록만)
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch crash submissions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install -q pyjwt cryptography requests
          python - <<'EOF'
          import os, time, jwt, requests, json
          key = os.environ["ASC_KEY_P8"]
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 1200,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256",
                           headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + tok}
          B = "https://api.appstoreconnect.apple.com/v1"
          apps = requests.get(B + "/apps", params={"filter[bundleId]": "com.mistylake.ktube"}, headers=H).json()
          app = apps["data"][0]["id"]
          r = requests.get(B + f"/apps/{app}/betaFeedbackCrashSubmissions",
                           params={"sort": "-createdDate", "limit": "5"}, headers=H)
          print("submissions status", r.status_code)
          js = r.json()
          os.makedirs("out", exist_ok=True)
          for i, s in enumerate(js.get("data", [])):
              a = s.get("attributes", {})
              meta = {k: a.get(k) for k in ("createdDate", "deviceModel", "osVersion", "appPlatform", "comment",
                                            "buildBundleId", "architecture", "connectionType") if k in a}
              print(i, json.dumps(meta, ensure_ascii=False))
              lg = requests.get(B + f"/betaFeedbackCrashSubmissions/{s['id']}/crashLog", headers=H)
              text = lg.json().get("data", {}).get("attributes", {}).get("logText", "") if lg.ok else f"crashLog {lg.status_code}"
              open(f"out/crash-{i}.txt", "w").write(json.dumps(meta, ensure_ascii=False) + "\n\n" + text)
              # 앱 스레드 부분만 로그에 조금
              lines = [l for l in text.splitlines() if "Vidbox" in l or "Exception" in l or "Termination" in l or "Crashed" in l]
              print("\n".join(lines[:40]))
          if not js.get("data"):
              print(json.dumps(js)[:800])
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: crash-logs
          path: out
          retention-days: 1
          if-no-files-found: ignore
