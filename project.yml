name: Vidbox
options:
  bundleIdPrefix: com.mistylake
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.2.0"

targets:
  Vidbox:
    type: application
    platform: iOS
    sources:
      - path: Vidbox
    dependencies:
      - package: YouTubeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mistylake.ktube
        PRODUCT_NAME: Vidbox
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.19.14"
        CURRENT_PROJECT_VERSION: "85"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: Vidbox/Info.plist
      properties:
        CFBundleDisplayName: K-TUBE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsForMedia: true
          # 집 Jellyfin 서버가 http라서 그 주소만 허용 (NSAllowsArbitraryLoads는 위 키들과 함께 쓰면 무시됨)
          NSExceptionDomains:
            mistylake.duckdns.org:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    scheme: {}
